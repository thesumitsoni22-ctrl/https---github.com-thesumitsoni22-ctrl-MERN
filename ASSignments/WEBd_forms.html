 <!-- Complex Form 3 -->
<form>
    <h1><b>Complex Form</b></h1><br>
    <fieldset>
        <legend>Personal Information</legend>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" required>

        <label for="Datepicker">Date of Birth:</label>
        <input type="Date" id="Datepicker" name="Date" required>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <label for="country">Country:</label>
        <select name="country" id="country">
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="uk">UK</option>
            <option value="australia">Australia</option>
        </select>
    </fieldset><br>

    <fieldset>
        <legend>Address</legend>

        <label for="address">Street:</label>
        <input type="text" id="address" name="address" required>

        <label for="city">City:</label>
        <input type="text" id="city" name="city" required>

        <label for="state">State:</label>
        <input type="text" id="state" name="state" required>    

        <label for="zip">Zip Code:</label>
        <input type="text" id="zip" name="zip" required>    
    </fieldset><br>

    <fieldset>
        <legend>Other Information</legend>

    <label for="comment">Comments:</label>
    <textarea name="comment" id="comment" rows="5" cols="30" placeholder="Comment here..."></textarea>

   
    <input type="checkbox" id="agree" name="agree">
    <label for="agree">I agree to the terms of service</label>
    </fieldset>

    <button type="submit">Submit</button>
</form>

    
</body>
