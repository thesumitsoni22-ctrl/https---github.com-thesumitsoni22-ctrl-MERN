    <!-- SOME HTML ELEMENTS EXAMPLES -->
     
<fieldset>
    <legend>A Dummy Form</legend>
    <label for="Datepicker">Choose Date :</label>
<input type="date" id="Datepicker">

<br>
<br/>

<label for="Dishes">Choose a Dish :</label>
<select  id="Dishes" multiple>
   <option value="Pizza">Pizza</option>
    <option value="Burger">Burger</option>      
    <option value="Pasta">Pasta</option>
</select>

<br>
<br/>

<button>Submit your choice</button>

<br>
<br/>

<textarea name="Comment here..." row="10" placeholder="Comment here."></textarea>

<br>
<br/>

<label for="fileselect">Choose a File:</label>
<input type="file" id="fileselect">

</fieldset>
